<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Catclawd happy (spin): 4s cycle. Cat-form Clawd (ears, tail, whiskers,
        pink nose and cheeks; colors unchanged) crouches, hops up and spins a
        full turn in the air (a horizontal flip: scaleX 1 -> -1 -> 1, so ears,
        tail and whiskers swap sides), lands with a squash and an ear bounce,
        then does two happy little hops with its tail quivering, surrounded by
        sparkles and small hearts. Happy ^^ eyes throughout.
      */
      .hop { transform-origin: 7.5px 15px; animation: hop 4s infinite ease-out; }
      .spin { transform-origin: 7.5px 15px; animation: spin 4s infinite ease-in-out; }
      .tail { transform-origin: 13.6px 12.2px; animation: tail-sway 0.5s infinite ease-in-out; }
      .ear-l { transform-origin: 3.2px 6px; animation: ear-l 4s infinite ease-out; }
      .ear-r { transform-origin: 11.8px 6px; animation: ear-r 4s infinite ease-out; }
      .arm-l { transform-origin: 2px 10px; animation: arm-l 4s infinite ease-in-out; }
      .arm-r { transform-origin: 13px 10px; animation: arm-r 4s infinite ease-in-out; }
      .shadow-hop { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow-hop 4s infinite ease-out; }
      .sp-1 { transform-box: fill-box; transform-origin: 50% 50%; animation: sparkle 4s infinite ease-out; }
      .sp-2 { transform-box: fill-box; transform-origin: 50% 50%; animation: sparkle 4s 0.5s infinite ease-out; }
      .sp-3 { transform-box: fill-box; transform-origin: 50% 50%; animation: sparkle 4s 1.0s infinite ease-out; }
      .sp-4 { transform-box: fill-box; transform-origin: 50% 50%; animation: sparkle 4s 2.3s infinite ease-out; }
      .ht-1 { transform-box: fill-box; transform-origin: 50% 50%; animation: heart-up 4s 2.5s infinite ease-out; }
      .ht-2 { transform-box: fill-box; transform-origin: 50% 50%; animation: heart-up 4s 3.1s infinite ease-out; }

      @keyframes hop {
        0%, 6%    { transform: translateY(0) scale(1, 1); }
        12%       { transform: translateY(0.6px) scale(1.08, 0.88); }
        18%       { transform: translateY(-2.5px) scale(0.96, 1.06); }
        30%       { transform: translateY(-4.2px) scale(1, 1); }
        42%       { transform: translateY(-2.5px) scale(0.96, 1.06); }
        49%       { transform: translateY(0) scale(1, 1); }
        52%       { transform: translateY(0.3px) scale(1.12, 0.84); }
        57%       { transform: translateY(0) scale(0.98, 1.03); }
        61%       { transform: translateY(0) scale(1, 1); }
        66%       { transform: translateY(0.3px) scale(1.05, 0.94); }
        72%       { transform: translateY(-1.4px) scale(0.98, 1.03); }
        78%       { transform: translateY(0) scale(1.04, 0.95); }
        82%       { transform: translateY(0) scale(1, 1); }
        86%       { transform: translateY(-1.1px) scale(0.98, 1.03); }
        91%       { transform: translateY(0) scale(1.04, 0.95); }
        95%, 100% { transform: translateY(0) scale(1, 1); }
      }
      @keyframes spin {
        0%, 12%   { transform: scaleX(1); }
        30%       { transform: scaleX(-1); }
        49%, 100% { transform: scaleX(1); }
      }
      @keyframes tail-sway {
        0%, 100% { transform: rotate(-18deg); }
        50%      { transform: rotate(18deg); }
      }
      @keyframes ear-l {
        0%, 10%   { transform: rotate(0deg); }
        14%       { transform: rotate(10deg); }
        30%       { transform: rotate(-8deg); }
        49%       { transform: rotate(0deg); }
        53%       { transform: rotate(22deg); }
        58%       { transform: rotate(-10deg); }
        63%       { transform: rotate(0deg); }
        74%       { transform: rotate(8deg); }
        80%       { transform: rotate(0deg); }
        88%       { transform: rotate(6deg); }
        93%, 100% { transform: rotate(0deg); }
      }
      @keyframes ear-r {
        0%, 10%   { transform: rotate(0deg); }
        14%       { transform: rotate(-10deg); }
        30%       { transform: rotate(8deg); }
        49%       { transform: rotate(0deg); }
        53%       { transform: rotate(-22deg); }
        58%       { transform: rotate(10deg); }
        63%       { transform: rotate(0deg); }
        74%       { transform: rotate(-8deg); }
        80%       { transform: rotate(0deg); }
        88%       { transform: rotate(-6deg); }
        93%, 100% { transform: rotate(0deg); }
      }
      @keyframes arm-l {
        0%, 8%    { transform: rotate(0deg); }
        18%, 42%  { transform: rotate(70deg); }
        52%       { transform: rotate(0deg); }
        70%       { transform: rotate(30deg); }
        78%       { transform: rotate(0deg); }
        86%       { transform: rotate(25deg); }
        93%, 100% { transform: rotate(0deg); }
      }
      @keyframes arm-r {
        0%, 8%    { transform: rotate(0deg); }
        18%, 42%  { transform: rotate(-70deg); }
        52%       { transform: rotate(0deg); }
        70%       { transform: rotate(-30deg); }
        78%       { transform: rotate(0deg); }
        86%       { transform: rotate(-25deg); }
        93%, 100% { transform: rotate(0deg); }
      }
      @keyframes shadow-hop {
        0%, 6%    { transform: scaleX(1); opacity: 0.5; }
        12%       { transform: scaleX(1.1); opacity: 0.55; }
        30%       { transform: scaleX(0.6); opacity: 0.2; }
        49%       { transform: scaleX(1); opacity: 0.5; }
        52%       { transform: scaleX(1.15); opacity: 0.55; }
        61%       { transform: scaleX(1); opacity: 0.5; }
        72%       { transform: scaleX(0.85); opacity: 0.4; }
        78%       { transform: scaleX(1.05); opacity: 0.52; }
        86%       { transform: scaleX(0.88); opacity: 0.42; }
        91%, 100% { transform: scaleX(1); opacity: 0.5; }
      }
      @keyframes sparkle {
        0%, 14%   { transform: scale(0.2) rotate(0deg); opacity: 0; }
        20%       { transform: scale(1) rotate(20deg); opacity: 1; }
        32%       { transform: scale(0.9) rotate(45deg); opacity: 0.9; }
        40%       { transform: scale(0.2) rotate(70deg); opacity: 0; }
        100%      { transform: scale(0.2) rotate(70deg); opacity: 0; }
      }
      @keyframes heart-up {
        0%, 2%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
        8%       { transform: translate(0, -0.8px) scale(1); opacity: 0.95; }
        26%      { transform: translate(0.6px, -3.5px) scale(1); opacity: 0.9; }
        34%      { transform: translate(0.8px, -4.5px) scale(1.1); opacity: 0; }
        100%     { transform: translate(0.8px, -4.5px) scale(1.1); opacity: 0; }
      }
    </style>
  </defs>

  <rect class="shadow-hop" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Cat-form Clawd: hop (translate/squash) -> spin (horizontal flip) -> parts -->
  <g class="hop">
    <g class="spin">
      <!-- tail: curls up from the lower right of the torso, sways about its root (13.6,12.2) -->
      <g class="tail">
        <g fill="#DE886D">
          <rect x="13" y="11.6" width="1.3" height="1.2"/><rect x="14" y="10.6" width="1.2" height="1.4"/>
          <rect x="14.6" y="9.2" width="1.1" height="1.7"/><rect x="14.5" y="7.8" width="1.1" height="1.6"/><rect x="13.9" y="6.8" width="1.2" height="1.2"/>
        </g>
      </g>
      <g fill="#DE886D">
        <rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/>
        <rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
      </g>
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <rect x="3" y="10.4" width="1.3" height="0.6" fill="#F8BBD0" opacity="0.9"/>
      <rect x="10.7" y="10.4" width="1.3" height="0.6" fill="#F8BBD0" opacity="0.9"/>
      <rect x="7.2" y="10.3" width="0.6" height="0.45" fill="#F8BBD0"/>
      <g stroke="#000000" stroke-width="0.3" stroke-linecap="round">
        <line x1="2" y1="8.2" x2="-0.6" y2="7.7"/><line x1="2" y1="8.9" x2="-0.6" y2="9"/>
        <line x1="13" y1="8.2" x2="15.6" y2="7.7"/><line x1="13" y1="8.9" x2="15.6" y2="9"/>
      </g>
      <g fill="none" stroke="#000000" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.5,9.5 4.5,8 5.5,9.5"/><polyline points="9.5,9.5 10.5,8 11.5,9.5"/>
      </g>
      <!-- ears: stair-step triangles on the top corners; each rotates about its base -->
      <g class="ear-l">
        <g fill="#DE886D"><rect x="2" y="5" width="2.5" height="1"/><rect x="2" y="4" width="1.5" height="1"/><rect x="2" y="3.2" width="0.7" height="0.8"/></g>
        <rect x="2.4" y="4.6" width="0.7" height="0.8" fill="#F8BBD0"/>
      </g>
      <g class="ear-r">
        <g fill="#DE886D"><rect x="10.5" y="5" width="2.5" height="1"/><rect x="11.5" y="4" width="1.5" height="1"/><rect x="12.3" y="3.2" width="0.7" height="0.8"/></g>
        <rect x="11.9" y="4.6" width="0.7" height="0.8" fill="#F8BBD0"/>
      </g>
      <g class="arm-l"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g>
      <g class="arm-r"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
    </g>
  </g>

  <!-- Sparkles around the spin, hearts during the happy hops -->
  <g>
    <g class="sp-1" fill="#FFD54F" opacity="0">
      <rect x="-1.85" y="1.9" width="0.7" height="2.2"/><rect x="-2.6" y="2.65" width="2.2" height="0.7"/>
    </g>
    <g class="sp-2" fill="#FFF59D" opacity="0">
      <rect x="16.15" y="0.3999999999999999" width="0.7" height="2.2"/><rect x="15.4" y="1.15" width="2.2" height="0.7"/>
    </g>
    <g class="sp-3" fill="#FFD54F" opacity="0">
      <rect x="1.65" y="-2.6" width="0.7" height="2.2"/><rect x="0.8999999999999999" y="-1.85" width="2.2" height="0.7"/>
    </g>
    <g class="sp-4" fill="#FFF59D" opacity="0">
      <rect x="13.15" y="-2.1" width="0.7" height="2.2"/><rect x="12.4" y="-1.35" width="2.2" height="0.7"/>
    </g>
    <g class="ht-1" fill="#F48FB1" opacity="0">
      <rect x="-1.6" y="6" width="0.5" height="0.5"/><rect x="-0.8" y="6" width="0.5" height="0.5"/>
      <rect x="-1.8" y="6.5" width="1.7" height="0.5"/><rect x="-1.4000000000000001" y="7" width="0.9" height="0.5"/><rect x="-1.1" y="7.5" width="0.3" height="0.3"/>
    </g>
    <g class="ht-2" fill="#F48FB1" opacity="0">
      <rect x="15.2" y="4.5" width="0.5" height="0.5"/><rect x="16.0" y="4.5" width="0.5" height="0.5"/>
      <rect x="15.0" y="5.0" width="1.7" height="0.5"/><rect x="15.399999999999999" y="5.5" width="0.9" height="0.5"/><rect x="15.7" y="6.0" width="0.3" height="0.3"/>
    </g>
  </g>
</svg>
