<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Dump truck: 4s cycle. Clawd IS the cab of a reckless dump truck:
        torso/eyes/arms kept, legs replaced by a chassis + 3 spinning wheels,
        a flashing beacon on the head, a steel dump bed full of dirt behind
        (left) with an exhaust stack puffing black smoke. He speeds right
        (road dashes scroll, body shakes, speed lines, dust), then the bed
        tips up and dirt clods spill out onto the road, and the bed drops back.
        0-55%:   driving
        55-65%:  bed tips up (rotate -22deg about the rear-bottom pivot)
        58-78%:  dirt clods tumble out of the back and fall to the road
        65-75%:  bed held up
        75-85%:  bed back down
        85-100%: driving
      */

      /* Whole truck: engine/road vibration */
      .truck-bob {
        transform-origin: 7.5px 15px;
        animation: truck-bob 0.3s infinite ease-in-out;
      }

      /* Dump bed: tips about its rear-bottom corner (-6,13) */
      .bed-tip {
        transform-origin: -6px 13px;
        animation: bed-tip 4s infinite ease-in-out;
      }

      /* Wheels: hub spoke spins */
      .spoke {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: spin 0.4s infinite linear;
      }

      /* Beacon lamp flashes */
      .beacon { animation: beacon-flash 0.5s infinite step-end; }
      .beacon-glow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: beacon-glow 0.5s infinite ease-in-out;
      }

      /* Eyes: reckless squint looking ahead, glance back while dumping, blinks on the same timeline */
      .eyes-drive {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-drive 4s infinite ease-in-out;
      }

      /* Exhaust smoke */
      .smoke { opacity: 0; }
      .smoke-1 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: smoke-rise 0.8s infinite ease-out;
      }
      .smoke-2 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: smoke-rise 0.8s 0.27s infinite ease-out;
      }
      .smoke-3 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: smoke-rise 0.8s 0.54s infinite ease-out;
      }

      /* Road dashes scroll backward (6-unit spacing, 6-unit travel = seamless) */
      .road { animation: road-scroll 0.4s infinite linear; }

      /* Speed lines behind the bed */
      .lines { animation: lines-flicker 0.3s infinite linear; }

      /* Dust behind the rear wheel */
      .puff {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: puff 0.4s infinite ease-out;
      }
      .puff-b { animation-delay: 0.2s; }

      /* Dirt clods spilling out of the back */
      .clod-1 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: clod-1 4s infinite ease-in;
      }
      .clod-2 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: clod-2 4s infinite ease-in;
      }
      .clod-3 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: clod-3 4s infinite ease-in;
      }
      .clod-4 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: clod-4 4s infinite ease-in;
      }

      /* Ground shadow pulses with the bob */
      .shadow-truck {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-bob 0.3s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes truck-bob {
        0%, 100% { transform: translate(0, 0); }
        30%      { transform: translate(0.15px, -0.45px); }
        70%      { transform: translate(-0.15px, -0.1px); }
      }

      @keyframes bed-tip {
        0%, 55%   { transform: rotate(0deg); }
        65%       { transform: rotate(-22deg); }
        75%       { transform: rotate(-22deg); }
        83%       { transform: rotate(1.5deg); }
        85%, 100% { transform: rotate(0deg); }
      }

      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes beacon-flash {
        0%   { opacity: 1; }
        50%  { opacity: 0.35; }
        100% { opacity: 1; }
      }
      @keyframes beacon-glow {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50%      { transform: scale(0.6); opacity: 0; }
      }

      @keyframes eyes-drive {
        0%, 28%    { transform: translateX(1.5px) scaleY(0.7); }
        29.5%      { transform: translateX(1.5px) scaleY(0.05); }
        31%, 54%   { transform: translateX(1.5px) scaleY(0.7); }
        57%, 74%   { transform: translateX(-1.5px) scaleY(0.7); }
        77%, 88%   { transform: translateX(1.5px) scaleY(0.7); }
        89.5%      { transform: translateX(1.5px) scaleY(0.05); }
        91%, 100%  { transform: translateX(1.5px) scaleY(0.7); }
      }

      @keyframes smoke-rise {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20%  { opacity: 0.9; }
        100% { transform: translate(-2.2px, -4px) scale(1.5); opacity: 0; }
      }

      @keyframes road-scroll {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-6px); }
      }

      @keyframes lines-flicker {
        0%   { transform: translateX(0); opacity: 0.9; }
        50%  { transform: translateX(-0.8px); opacity: 0.35; }
        100% { transform: translateX(0); opacity: 0.9; }
      }

      @keyframes puff {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        30%  { transform: translate(-0.6px, -0.4px) scale(1); opacity: 0.9; }
        100% { transform: translate(-2px, -1.4px) scale(1.5); opacity: 0; }
      }

      /* Clods: spawn at the tipped rear rim (~-8.5, 6.5), tumble down-left to the road (~y 15) */
      @keyframes clod-1 {
        0%, 58%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        59%       { transform: translate(-0.3px, -0.6px) rotate(20deg); opacity: 1; }
        66%       { transform: translate(-1.8px, 6px) rotate(160deg); opacity: 1; }
        69%       { transform: translate(-2.4px, 8.6px) rotate(220deg); opacity: 1; }
        70%       { transform: translate(-2.5px, 8.6px) rotate(220deg); opacity: 0; }
        100%      { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      }
      @keyframes clod-2 {
        0%, 61%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        62%       { transform: translate(-0.4px, -0.5px) rotate(-30deg); opacity: 1; }
        69%       { transform: translate(-2.6px, 6.2px) rotate(-200deg); opacity: 1; }
        72%       { transform: translate(-3.2px, 8.8px) rotate(-260deg); opacity: 1; }
        73%       { transform: translate(-3.3px, 8.8px) rotate(-260deg); opacity: 0; }
        100%      { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      }
      @keyframes clod-3 {
        0%, 64%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        65%       { transform: translate(-0.2px, -0.7px) rotate(40deg); opacity: 1; }
        72%       { transform: translate(-1.4px, 6.4px) rotate(190deg); opacity: 1; }
        75%       { transform: translate(-1.8px, 9px) rotate(240deg); opacity: 1; }
        76%       { transform: translate(-1.9px, 9px) rotate(240deg); opacity: 0; }
        100%      { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      }
      @keyframes clod-4 {
        0%, 66%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        67%       { transform: translate(-0.5px, -0.4px) rotate(-20deg); opacity: 1; }
        74%       { transform: translate(-2.2px, 6.6px) rotate(-150deg); opacity: 1; }
        77%       { transform: translate(-2.8px, 9.2px) rotate(-200deg); opacity: 1; }
        78%       { transform: translate(-2.9px, 9.2px) rotate(-200deg); opacity: 0; }
        100%      { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      }

      @keyframes shadow-bob {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        30%      { transform: scaleX(1.03); opacity: 0.45; }
      }
    </style>

    <!-- Road window: keeps the scrolling dashes inside a fixed span -->
    <clipPath id="road-clip">
      <rect x="-9" y="16" width="25" height="3"/>
    </clipPath>
  </defs>

  <!-- === Road dashes (scrolling backward), clipped === -->
  <g clip-path="url(#road-clip)">
    <g class="road" fill="#9E9E9E">
      <rect x="-9" y="17" width="2.5" height="0.5"/>
      <rect x="-3" y="17" width="2.5" height="0.5"/>
      <rect x="3" y="17" width="2.5" height="0.5"/>
      <rect x="9" y="17" width="2.5" height="0.5"/>
      <rect x="15" y="17" width="2.5" height="0.5"/>
    </g>
  </g>

  <!-- Ground Shadow (under the whole truck) -->
  <rect class="shadow-truck" x="-5" y="15" width="21" height="1" fill="#000000" opacity="0.5"/>

  <!-- === Speed lines behind the bed (world space) === -->
  <g class="lines" fill="#9E9E9E">
    <rect x="-10" y="8" width="2" height="0.5"/>
    <rect x="-10.5" y="10" width="2.5" height="0.5"/>
    <rect x="-10" y="12" width="2" height="0.5"/>
  </g>

  <!-- === The truck === -->
  <g class="truck-bob">

    <!-- Dump bed (behind the cab, tips about its rear-bottom corner) -->
    <g class="bed-tip">
      <!-- Dirt load -->
      <g fill="#795548">
        <rect x="-5.6" y="5.6" width="5.2" height="1.6"/>
        <rect x="-4.9" y="4.6" width="3.8" height="1.1"/>
        <rect x="-3.9" y="3.8" width="1.9" height="0.9"/>
        <rect x="-4.7" y="5.1" width="1" height="0.6" fill="#8D6E63"/>
        <rect x="-2.6" y="4.9" width="0.8" height="0.6" fill="#8D6E63"/>
        <rect x="-3.4" y="5.9" width="0.9" height="0.7" fill="#5D4037"/>
      </g>
      <!-- Bed box + rim + ribs -->
      <rect x="-6" y="7" width="6" height="6" fill="#607D8B"/>
      <rect x="-6.3" y="6.6" width="6.6" height="0.7" fill="#90A4AE"/>
      <rect x="-4.2" y="7.5" width="0.35" height="5.2" fill="#455A64"/>
      <rect x="-2.2" y="7.5" width="0.35" height="5.2" fill="#455A64"/>
    </g>

    <!-- Exhaust stack + smoke (between bed and cab) -->
    <rect x="0.3" y="3" width="0.8" height="4.5" fill="#37474F"/>
    <rect x="0.15" y="2.8" width="1.1" height="0.5" fill="#263238"/>
    <g fill="#616161">
      <rect class="smoke smoke-1" x="0.1" y="1.6" width="1.2" height="1.2" rx="0.6"/>
      <rect class="smoke smoke-2" x="0.2" y="1.5" width="1.1" height="1.1" rx="0.55"/>
      <rect class="smoke smoke-3" x="0" y="1.7" width="1.3" height="1.3" rx="0.65"/>
    </g>

    <!-- Chassis + front bumper -->
    <rect x="-6.5" y="13" width="22" height="1.3" fill="#37474F"/>
    <rect x="15" y="12.4" width="1.2" height="1.9" fill="#546E7A"/>

    <!-- Cab: Clawd torso -->
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

    <!-- Eyes -->
    <g class="eyes-drive" fill="#000000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>

    <!-- Arms -->
    <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

    <!-- Beacon light on the head -->
    <rect x="6.5" y="5.2" width="2" height="0.8" fill="#455A64"/>
    <rect class="beacon-glow" x="6.1" y="3.4" width="2.8" height="2.2" rx="0.6" fill="#FFE082" opacity="0.55"/>
    <rect class="beacon" x="6.9" y="4.1" width="1.2" height="1.2" rx="0.25" fill="#FFC107"/>

    <!-- Wheels (in front of chassis and bed) -->
    <g>
      <circle cx="-3.5" cy="14.6" r="1.7" fill="#212121"/>
      <circle cx="-3.5" cy="14.6" r="0.8" fill="#9E9E9E"/>
      <rect class="spoke" x="-3.68" y="13.9" width="0.36" height="1.4" fill="#424242"/>
    </g>
    <g>
      <circle cx="4.5" cy="14.6" r="1.7" fill="#212121"/>
      <circle cx="4.5" cy="14.6" r="0.8" fill="#9E9E9E"/>
      <rect class="spoke" x="4.32" y="13.9" width="0.36" height="1.4" fill="#424242"/>
    </g>
    <g>
      <circle cx="11.5" cy="14.6" r="1.7" fill="#212121"/>
      <circle cx="11.5" cy="14.6" r="0.8" fill="#9E9E9E"/>
      <rect class="spoke" x="11.32" y="13.9" width="0.36" height="1.4" fill="#424242"/>
    </g>

  </g>

  <!-- === Dirt clods spilling out of the back (world space, start at the tipped rear rim) === -->
  <g>
    <rect class="clod-1" x="-8.6" y="6.2" width="1.1" height="1" fill="#795548" opacity="0"/>
    <rect class="clod-2" x="-8.2" y="6.6" width="0.9" height="0.9" fill="#6D4C41" opacity="0"/>
    <rect class="clod-3" x="-8.9" y="6.9" width="1.2" height="1" fill="#8D6E63" opacity="0"/>
    <rect class="clod-4" x="-8.3" y="6.1" width="0.8" height="0.8" fill="#795548" opacity="0"/>
  </g>

  <!-- === Dust behind the rear wheel === -->
  <g fill="#BDBDBD">
    <rect class="puff" x="-6.6" y="14.9" width="1" height="1"/>
    <rect class="puff puff-b" x="-6" y="15.4" width="0.8" height="0.8"/>
  </g>
</svg>
