<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Eruption (angry, volcano head): 4s cycle.
        0-44%:   pressure builds - the red flush (already 30% up at t=0) climbs the body,
                 Clawd swells, trembles, steam leaks from the top of his head
        45-47%:  ERUPTION - three fire columns burst up from 2.5 units above his head,
                 lava chunks fly out in arcs, he squashes down
        47-84%:  the columns burn and flicker, eyes wide then squinting
        84-100%: the columns die down, the flush drains, he deflates and resets
        The flush never drains below 30%, so the static first frame already
        shows a red-faced, angry-browed Clawd.
      */
      .tremble { transform-origin: 7.5px 15px; animation: tremble 0.1s infinite linear; }
      .arm-l { animation: arm-tremble-l 0.1s infinite linear; }
      .arm-r { animation: arm-tremble-r 0.1s infinite linear; }
      .shadow-fury { transform-box: fill-box; transform-origin: 50% 50%; animation: tremble 0.1s infinite linear; }
      @keyframes tremble {
        0%   { transform: translate(0.15px, 0); }
        25%  { transform: translate(-0.15px, 0.1px); }
        50%  { transform: translate(0.1px, -0.1px); }
        75%  { transform: translate(-0.1px, 0.05px); }
        100% { transform: translate(0.15px, 0); }
      }
      @keyframes arm-tremble-l { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-0.2px, 0.2px); } }
      @keyframes arm-tremble-r { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0.2px, -0.2px); } }
      .swell { transform-origin: 7.5px 15px; animation: swell 4s infinite ease-in-out; }
      .pressure { transform-origin: 7.5px 13px; animation: pressure 4s infinite linear; }
      .erupt { transform-origin: 7.5px 3.5px; animation: erupt 4s infinite ease-out; }
      .col-flick { transform-origin: 7.5px 3.5px; animation: col-flick 0.3s infinite ease-in-out; }
      .col-flick-2 { transform-origin: 7.5px 3.5px; animation: col-flick 0.25s 0.1s infinite ease-in-out; }
      .col-flick-3 { transform-origin: 7.5px 3.5px; animation: col-flick 0.25s 0.2s infinite ease-in-out; }
      .eyes-erupt { transform-box: fill-box; transform-origin: 50% 50%; animation: eyes-erupt 4s infinite ease-in-out; }
      .steam-gate { animation: steam-gate 4s infinite step-end; }
      .steam { opacity: 0; }
      .steam-1 { transform-box: fill-box; transform-origin: 50% 50%; animation: steam-rise 0.5s infinite ease-out; }
      .steam-2 { transform-box: fill-box; transform-origin: 50% 50%; animation: steam-rise 0.5s 0.17s infinite ease-out; }
      .steam-3 { transform-box: fill-box; transform-origin: 50% 50%; animation: steam-rise 0.5s 0.34s infinite ease-out; }
      @keyframes swell {
        0%        { transform: scale(1, 1); }
        44%       { transform: scale(1.1, 1.07); }
        46.5%     { transform: scale(0.94, 0.86); }
        50%       { transform: scale(1.04, 1.02); }
        55%, 84%  { transform: scale(1, 1); }
        96%, 100% { transform: scale(1, 1); }
      }
      @keyframes pressure {
        0%        { transform: scaleY(0.3); opacity: 0.55; }
        44%       { transform: scaleY(1); opacity: 0.55; }
        84%       { transform: scaleY(1); opacity: 0.55; }
        96%, 100% { transform: scaleY(0.3); opacity: 0.55; }
      }
      @keyframes erupt {
        0%, 44%   { transform: scaleY(0); opacity: 0; }
        44.5%     { transform: scaleY(0.05); opacity: 1; }
        47%       { transform: scaleY(1.08); opacity: 1; }
        51%       { transform: scaleY(0.95); opacity: 1; }
        55%       { transform: scaleY(1.03); opacity: 1; }
        60%, 84%  { transform: scaleY(1); opacity: 1; }
        90%       { transform: scaleY(0.55); opacity: 1; }
        95%       { transform: scaleY(0.08); opacity: 1; }
        95.5%, 100% { transform: scaleY(0); opacity: 0; }
      }
      @keyframes col-flick { 0%, 100% { transform: scale(1, 1) translateX(0); } 50% { transform: scale(1.06, 1.06) translateX(0.3px); } }
      @keyframes eyes-erupt {
        0%        { transform: scaleY(0.7); }
        44%       { transform: scaleY(0.35); }
        46%, 58%  { transform: scaleY(1.15); }
        62%, 84%  { transform: scaleY(0.6); }
        92%, 100% { transform: scaleY(0.7); }
      }
      @keyframes steam-gate { 0% { opacity: 0; } 14% { opacity: 1; } 44% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes steam-rise { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 25% { opacity: 0.85; } 100% { transform: translate(0, -3.5px) scale(1.3); opacity: 0; } }
      .lava-1 { transform-box: fill-box; transform-origin: 50% 50%; animation: lava-1 4s infinite ease-in; }
      @keyframes lava-1 { 0%, 45% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 46% { transform: translate(0, -1px) rotate(0deg); opacity: 1; } 52% { transform: translate(-4.2px, -4.1px) rotate(90deg); opacity: 1; } 60% { transform: translate(-7px, 6px) rotate(200deg); opacity: 1; } 63% { transform: translate(-7px, 6.5px) rotate(220deg); opacity: 0; } 100% { opacity: 0; } }
      .lava-2 { transform-box: fill-box; transform-origin: 50% 50%; animation: lava-2 4s infinite ease-in; }
      @keyframes lava-2 { 0%, 45% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 46% { transform: translate(0, -1px) rotate(0deg); opacity: 1; } 52% { transform: translate(4.2px, -4.1px) rotate(-90deg); opacity: 1; } 60% { transform: translate(7px, 6px) rotate(-200deg); opacity: 1; } 63% { transform: translate(7px, 6.5px) rotate(-220deg); opacity: 0; } 100% { opacity: 0; } }
      .lava-3 { transform-box: fill-box; transform-origin: 50% 50%; animation: lava-3 4s infinite ease-in; }
      @keyframes lava-3 { 0%, 45% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 46% { transform: translate(0, -1px) rotate(0deg); opacity: 1; } 52% { transform: translate(-2.7px, -3.65px) rotate(90deg); opacity: 1; } 60% { transform: translate(-4.5px, 9px) rotate(200deg); opacity: 1; } 63% { transform: translate(-4.5px, 9.5px) rotate(220deg); opacity: 0; } 100% { opacity: 0; } }
      .lava-4 { transform-box: fill-box; transform-origin: 50% 50%; animation: lava-4 4s infinite ease-in; }
      @keyframes lava-4 { 0%, 45% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 46% { transform: translate(0, -1px) rotate(0deg); opacity: 1; } 52% { transform: translate(2.7px, -3.65px) rotate(-90deg); opacity: 1; } 60% { transform: translate(4.5px, 9px) rotate(-200deg); opacity: 1; } 63% { transform: translate(4.5px, 9.5px) rotate(-220deg); opacity: 0; } 100% { opacity: 0; } }
      .lava-5 { transform-box: fill-box; transform-origin: 50% 50%; animation: lava-5 4s infinite ease-in; }
      @keyframes lava-5 { 0%, 45% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 46% { transform: translate(0, -1px) rotate(0deg); opacity: 1; } 52% { transform: translate(-1.2px, -3.5px) rotate(90deg); opacity: 1; } 60% { transform: translate(-2px, 10px) rotate(200deg); opacity: 1; } 63% { transform: translate(-2px, 10.5px) rotate(220deg); opacity: 0; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect class="shadow-fury" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Clawd -->
  <g class="tremble">
    <g class="swell">
      <g fill="#DE886D">
        <rect x="3" y="13" width="1" height="2"/>
        <rect x="5" y="13" width="1" height="2"/>
        <rect x="9" y="13" width="1" height="2"/>
        <rect x="11" y="13" width="1" height="2"/>
      </g>
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <rect class="pressure" x="2" y="6" width="11" height="7" fill="#D32F2F" opacity="0.55"/>
      <g fill="#000000">
        <rect x="3.5" y="6.9" width="1.9" height="0.55" transform="rotate(22, 4.45, 7.17)"/>
        <rect x="9.6" y="6.9" width="1.9" height="0.55" transform="rotate(-22, 10.55, 7.17)"/>
      </g>
      <g class="eyes-erupt" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
      <g class="arm-l"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g>
      <g class="arm-r"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>

      <!-- Steam leaking from the head before the eruption -->
      <g class="steam-gate" fill="#B0BEC5" opacity="0">
        <rect class="steam steam-1" x="5.4" y="4.2" width="1" height="1" rx="0.5"/>
        <rect class="steam steam-2" x="7" y="4" width="1.1" height="1.1" rx="0.55"/>
        <rect class="steam steam-3" x="8.6" y="4.2" width="0.9" height="0.9" rx="0.45"/>
      </g>

      <!-- Fire column bursting out of the top of the head -->
      <g class="erupt" opacity="0">
        <!-- three columns: the same flame drawn at 2x, placed at x 4 / 7.5 / 11 and shrunk about the shared base line y=3.5 -->
        <g transform="translate(4, 3.5) scale(0.35) translate(-7.5, -3.5)">
          <g class="col-flick-2">
            <rect x="4.5" y="0.5" width="6" height="3" fill="#FF3D00"/>
            <rect x="5" y="-1.8" width="5" height="2.3" fill="#FF3D00"/>
            <rect x="5.5" y="-3.6" width="4" height="1.8" fill="#FF3D00"/>
            <rect x="6" y="-5" width="3" height="1.4" fill="#FF3D00"/>
            <rect x="6.5" y="-5.8" width="2" height="0.8" fill="#FF3D00"/>
            <rect x="5.5" y="1" width="4" height="2.5" fill="#FF9100"/>
            <rect x="6" y="-1" width="3" height="2" fill="#FF9100"/>
            <rect x="6.5" y="-2.6" width="2" height="1.6" fill="#FF9100"/>
            <rect x="7" y="-3.8" width="1" height="1.2" fill="#FF9100"/>
            <rect x="6.5" y="1.4" width="2" height="2.1" fill="#FFD54F"/>
            <rect x="7" y="-0.4" width="1" height="1.8" fill="#FFD54F"/>
          </g>
        </g>
        <g transform="translate(11, 3.5) scale(0.35) translate(-7.5, -3.5)">
          <g class="col-flick-3">
            <rect x="4.5" y="0.5" width="6" height="3" fill="#FF3D00"/>
            <rect x="5" y="-1.8" width="5" height="2.3" fill="#FF3D00"/>
            <rect x="5.5" y="-3.6" width="4" height="1.8" fill="#FF3D00"/>
            <rect x="6" y="-5" width="3" height="1.4" fill="#FF3D00"/>
            <rect x="6.5" y="-5.8" width="2" height="0.8" fill="#FF3D00"/>
            <rect x="5.5" y="1" width="4" height="2.5" fill="#FF9100"/>
            <rect x="6" y="-1" width="3" height="2" fill="#FF9100"/>
            <rect x="6.5" y="-2.6" width="2" height="1.6" fill="#FF9100"/>
            <rect x="7" y="-3.8" width="1" height="1.2" fill="#FF9100"/>
            <rect x="6.5" y="1.4" width="2" height="2.1" fill="#FFD54F"/>
            <rect x="7" y="-0.4" width="1" height="1.8" fill="#FFD54F"/>
          </g>
        </g>
        <g transform="translate(7.5, 3.5) scale(0.5) translate(-7.5, -3.5)">
          <g class="col-flick">
            <rect x="4.5" y="0.5" width="6" height="3" fill="#FF3D00"/>
            <rect x="5" y="-1.8" width="5" height="2.3" fill="#FF3D00"/>
            <rect x="5.5" y="-3.6" width="4" height="1.8" fill="#FF3D00"/>
            <rect x="6" y="-5" width="3" height="1.4" fill="#FF3D00"/>
            <rect x="6.5" y="-5.8" width="2" height="0.8" fill="#FF3D00"/>
            <rect x="5.5" y="1" width="4" height="2.5" fill="#FF9100"/>
            <rect x="6" y="-1" width="3" height="2" fill="#FF9100"/>
            <rect x="6.5" y="-2.6" width="2" height="1.6" fill="#FF9100"/>
            <rect x="7" y="-3.8" width="1" height="1.2" fill="#FF9100"/>
            <rect x="6.5" y="1.4" width="2" height="2.1" fill="#FFD54F"/>
            <rect x="7" y="-0.4" width="1" height="1.8" fill="#FFD54F"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Lava chunks -->
  <g>
    <rect class="lava-1" x="6.4" y="3.2" width="0.9" height="0.9" fill="#3E2723" opacity="0"/>
    <rect class="lava-2" x="6.7" y="3.2" width="0.7" height="0.7" fill="#4E342E" opacity="0"/>
    <rect class="lava-3" x="7" y="3.2" width="0.9" height="0.9" fill="#3E2723" opacity="0"/>
    <rect class="lava-4" x="7.3" y="3.2" width="0.7" height="0.7" fill="#4E342E" opacity="0"/>
    <rect class="lava-5" x="7.6" y="3.2" width="0.9" height="0.9" fill="#3E2723" opacity="0"/>
  </g></svg>
