<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Rampage: 4s cycle. Clawd charges left/right and headbutts things off the frame.
        0-10%:   rev up on the left (legs scramble in place, lean back, dust)
        10-26%:  dash right (accelerating)
        26%:     IMPACT crate -> squash, sparks, crate flies off, eyes shut (bonk)
        32-46%:  bounce back, dazed, turn to face left
        46-52%:  rev up facing left
        52-68%:  dash left
        68%:     IMPACT trash can -> same beats mirrored
        74-88%:  bounce back, dazed, turn to face right
        88-100%: back up into the starting position (loop seam)
        Crate respawns (drops in) at 78-84%, can respawns at 36-42%.
      */

      /* Whole body: horizontal charge */
      .charge-move {
        transform-origin: 7.5px 15px;
        animation: charge-move 4s infinite ease-in-out;
      }

      /* Whole body: small bounce with each scrambling step */
      .run-bounce {
        transform-origin: 7.5px 15px;
        animation: run-bounce 0.25s infinite ease-in-out;
      }

      /* Whole body: squash on impact (anchored at the feet) */
      .impact-squash {
        transform-origin: 7.5px 15px;
        animation: impact-squash 4s infinite ease-out;
      }

      /* Upper body (torso + eyes + arms): lean back to rev, lean forward to charge */
      .upper-lean {
        transform-origin: 7.5px 13px;
        animation: upper-lean 4s infinite ease-in-out;
      }

      /* Legs: outer pair vs inner pair, out of phase, scrambling all the time */
      .leg-outer { animation: step-outer 0.25s infinite ease-in-out; }
      .leg-inner { animation: step-inner 0.25s infinite ease-in-out; }

      /* Eyes: angry squint, look toward the charge direction, shut at impact */
      .eyes-charge {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-charge 4s infinite ease-in-out;
      }

      /* Arms: leading arm forward (translate), fast swing (rotate) */
      .arm-l-turn { animation: arm-l-turn 4s infinite ease-in-out; }
      .arm-r-turn { animation: arm-r-turn 4s infinite ease-in-out; }
      .arm-l {
        transform-origin: 2px 10px;
        animation: arm-swing-a 0.25s infinite ease-in-out;
      }
      .arm-r {
        transform-origin: 13px 10px;
        animation: arm-swing-b 0.25s infinite ease-in-out;
      }

      /* Anger mark above the head: always on, pulsing */
      .anger-mark {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: anger-pulse 0.5s infinite ease-in-out;
      }

      /* Ground shadow follows the body */
      .shadow-charge {
        transform-origin: 7.5px 15.5px;
        animation: shadow-charge 4s infinite ease-in-out;
      }

      /* Crate (right) and trash can (left): knocked flying, then drop back in */
      .crate-fly {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: crate-fly 4s infinite ease-out;
      }
      .can-fly {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: can-fly 4s infinite ease-out;
      }

      /* Impact sparks, right side (26-33%) and left side (68-75%) */
      .spark-r1 { animation: spark-r1 4s infinite ease-out; }
      .spark-r2 { animation: spark-r2 4s infinite ease-out; }
      .spark-r3 { animation: spark-r3 4s infinite ease-out; }
      .spark-l1 { animation: spark-l1 4s infinite ease-out; }
      .spark-l2 { animation: spark-l2 4s infinite ease-out; }
      .spark-l3 { animation: spark-l3 4s infinite ease-out; }

      /* Speed lines trailing behind the body during each dash */
      .lines-l { animation: lines-l 4s infinite linear; }
      .lines-r { animation: lines-r 4s infinite linear; }

      /* Dust puffs while revving: gated per side, puffs loop fast */
      .dust-gate-l { animation: dust-gate-l 4s infinite step-end; }
      .dust-gate-r { animation: dust-gate-r 4s infinite step-end; }
      .puff-l {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: puff-l 0.4s infinite ease-out;
      }
      .puff-r {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: puff-r 0.4s infinite ease-out;
      }
      .puff-b { animation-delay: 0.2s; }

      /* --- Keyframes --- */

      @keyframes charge-move {
        0%    { transform: translateX(-2.5px); }
        10%   { transform: translateX(-3px); animation-timing-function: cubic-bezier(0.75, 0, 1, 1); }
        26%   { transform: translateX(2.5px); animation-timing-function: ease-out; }
        27.5% { transform: translateX(2.8px); animation-timing-function: ease-out; }
        32%   { transform: translateX(1.6px); }
        46%   { transform: translateX(1.6px); }
        52%   { transform: translateX(2.2px); animation-timing-function: cubic-bezier(0.75, 0, 1, 1); }
        68%   { transform: translateX(-2.5px); animation-timing-function: ease-out; }
        69.5% { transform: translateX(-2.8px); animation-timing-function: ease-out; }
        74%   { transform: translateX(-1.6px); }
        88%   { transform: translateX(-1.6px); }
        100%  { transform: translateX(-2.5px); }
      }

      @keyframes run-bounce {
        0%, 100% { transform: translateY(0); }
        25%      { transform: translateY(-0.5px); }
        50%      { transform: translateY(0); }
        75%      { transform: translateY(-0.5px); }
      }

      @keyframes impact-squash {
        0%, 25%   { transform: scale(1, 1); }
        27.5%     { transform: scale(0.9, 1.08); }
        31%       { transform: scale(1.05, 0.96); }
        34%       { transform: scale(1, 1); }
        67%       { transform: scale(1, 1); }
        69.5%     { transform: scale(0.9, 1.08); }
        73%       { transform: scale(1.05, 0.96); }
        76%, 100% { transform: scale(1, 1); }
      }

      @keyframes upper-lean {
        0%, 10%   { transform: translate(-0.8px, 0.4px); }   /* rev: lean back, crouch */
        15%       { transform: translate(1px, 0.3px); }      /* charge: lean forward */
        26%       { transform: translate(1px, 0.3px); }
        28%       { transform: translate(1.2px, 0); }        /* impact */
        34%       { transform: translate(0, 0); }
        40%       { transform: translate(0, 0); }
        46%, 52%  { transform: translate(0.8px, 0.4px); }    /* rev facing left */
        57%       { transform: translate(-1px, 0.3px); }
        68%       { transform: translate(-1px, 0.3px); }
        70%       { transform: translate(-1.2px, 0); }
        76%       { transform: translate(0, 0); }
        88%       { transform: translate(0, 0); }
        94%, 100% { transform: translate(-0.8px, 0.4px); }
      }

      @keyframes step-outer {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-1.2px); }
      }
      @keyframes step-inner {
        0%, 100% { transform: translateY(-1.2px); }
        50%      { transform: translateY(0); }
      }

      @keyframes eyes-charge {
        0%, 25%     { transform: translateX(1.5px) scaleY(0.65); }
        26.5%, 29%  { transform: translateX(1.5px) scaleY(0.05); }   /* bonk */
        31%, 38%    { transform: translateX(1.5px) scaleY(0.9); }    /* dazed */
        41%, 67%    { transform: translateX(-1.5px) scaleY(0.65); }  /* turn, squint */
        68.5%, 71%  { transform: translateX(-1.5px) scaleY(0.05); }
        73%, 80%    { transform: translateX(-1.5px) scaleY(0.9); }
        83%, 100%   { transform: translateX(1.5px) scaleY(0.65); }
      }

      /* Right arm forward while facing right (0-38%, 84-100%) */
      @keyframes arm-r-turn {
        0%, 38%   { transform: translate(-3px, 1px); }
        42%, 80%  { transform: translate(0, 0); }
        84%, 100% { transform: translate(-3px, 1px); }
      }
      /* Left arm forward while facing left (42-80%) */
      @keyframes arm-l-turn {
        0%, 38%   { transform: translate(0, 0); }
        42%, 80%  { transform: translate(3px, 1px); }
        84%, 100% { transform: translate(0, 0); }
      }
      @keyframes arm-swing-a {
        0%, 100% { transform: rotate(15deg); }
        50%      { transform: rotate(-10deg); }
      }
      @keyframes arm-swing-b {
        0%, 100% { transform: rotate(-15deg); }
        50%      { transform: rotate(10deg); }
      }

      @keyframes anger-pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.2); }
      }

      @keyframes shadow-charge {
        0%    { transform: translateX(-2.5px) scaleX(1); }
        10%   { transform: translateX(-3px) scaleX(1); animation-timing-function: cubic-bezier(0.75, 0, 1, 1); }
        26%   { transform: translateX(2.5px) scaleX(0.9); animation-timing-function: ease-out; }
        27.5% { transform: translateX(2.8px) scaleX(1.1); animation-timing-function: ease-out; }
        32%   { transform: translateX(1.6px) scaleX(1); }
        46%   { transform: translateX(1.6px) scaleX(1); }
        52%   { transform: translateX(2.2px) scaleX(1); animation-timing-function: cubic-bezier(0.75, 0, 1, 1); }
        68%   { transform: translateX(-2.5px) scaleX(0.9); animation-timing-function: ease-out; }
        69.5% { transform: translateX(-2.8px) scaleX(1.1); animation-timing-function: ease-out; }
        74%   { transform: translateX(-1.6px) scaleX(1); }
        88%   { transform: translateX(-1.6px) scaleX(1); }
        100%  { transform: translateX(-2.5px) scaleX(1); }
      }

      /* Crate: hit at 26%, tumbles up-right, gone by 38.5%, drops back in at 78-84% */
      @keyframes crate-fly {
        0%, 25%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
        26.5%     { transform: translate(0.6px, -0.8px) rotate(15deg); opacity: 1; }
        32%       { transform: translate(2px, -4.5px) rotate(110deg); opacity: 1; }
        37%       { transform: translate(2.6px, -6.2px) rotate(200deg); opacity: 0.6; }
        38.5%     { transform: translate(2.8px, -6.4px) rotate(220deg); opacity: 0; }
        78%       { transform: translate(0, -6px) rotate(0deg); opacity: 0; }
        84%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      }

      /* Trash can: drops in at 36-42%, hit at 68%, tumbles up-left, gone by 80.5% */
      @keyframes can-fly {
        0%, 36%   { transform: translate(0, -6px) rotate(0deg); opacity: 0; }
        42%, 67%  { transform: translate(0, 0) rotate(0deg); opacity: 1; }
        68.5%     { transform: translate(-0.6px, -0.8px) rotate(-15deg); opacity: 1; }
        74%       { transform: translate(-2px, -4.5px) rotate(-110deg); opacity: 1; }
        79%       { transform: translate(-2.6px, -6.2px) rotate(-200deg); opacity: 0.6; }
        80.5%     { transform: translate(-2.8px, -6.4px) rotate(-220deg); opacity: 0; }
        100%      { transform: translate(0, -6px) rotate(0deg); opacity: 0; }
      }

      @keyframes spark-r1 {
        0%, 26%  { transform: translate(0, 0); opacity: 0; }
        27%      { transform: translate(0, 0); opacity: 0.95; }
        33%      { transform: translate(2px, -2.5px); opacity: 0; }
        100%     { opacity: 0; }
      }
      @keyframes spark-r2 {
        0%, 26.5% { transform: translate(0, 0); opacity: 0; }
        27.5%     { transform: translate(0, 0); opacity: 0.95; }
        33.5%     { transform: translate(3px, -0.5px); opacity: 0; }
        100%      { opacity: 0; }
      }
      @keyframes spark-r3 {
        0%, 26.5% { transform: translate(0, 0); opacity: 0; }
        27.5%     { transform: translate(0, 0); opacity: 0.9; }
        34%       { transform: translate(1.2px, -3.5px); opacity: 0; }
        100%      { opacity: 0; }
      }
      @keyframes spark-l1 {
        0%, 68%  { transform: translate(0, 0); opacity: 0; }
        69%      { transform: translate(0, 0); opacity: 0.95; }
        75%      { transform: translate(-2px, -2.5px); opacity: 0; }
        100%     { opacity: 0; }
      }
      @keyframes spark-l2 {
        0%, 68.5% { transform: translate(0, 0); opacity: 0; }
        69.5%     { transform: translate(0, 0); opacity: 0.95; }
        75.5%     { transform: translate(-3px, -0.5px); opacity: 0; }
        100%      { opacity: 0; }
      }
      @keyframes spark-l3 {
        0%, 68.5% { transform: translate(0, 0); opacity: 0; }
        69.5%     { transform: translate(0, 0); opacity: 0.9; }
        76%       { transform: translate(-1.2px, -3.5px); opacity: 0; }
        100%      { opacity: 0; }
      }

      @keyframes lines-l {
        0%, 11% { transform: translateX(0); opacity: 0; }
        13%     { transform: translateX(0); opacity: 0.9; }
        20%     { transform: translateX(-0.8px); opacity: 0.9; }
        26%     { transform: translateX(-1.5px); opacity: 0; }
        100%    { transform: translateX(-1.5px); opacity: 0; }
      }
      @keyframes lines-r {
        0%, 53% { transform: translateX(0); opacity: 0; }
        55%     { transform: translateX(0); opacity: 0.9; }
        62%     { transform: translateX(0.8px); opacity: 0.9; }
        68%     { transform: translateX(1.5px); opacity: 0; }
        100%    { transform: translateX(1.5px); opacity: 0; }
      }

      @keyframes dust-gate-l {
        0%, 9%    { opacity: 1; }
        11%, 87%  { opacity: 0; }
        89%, 100% { opacity: 1; }
      }
      @keyframes dust-gate-r {
        0%, 45%   { opacity: 0; }
        47%, 51%  { opacity: 1; }
        53%, 100% { opacity: 0; }
      }
      @keyframes puff-l {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        30%  { transform: translate(-0.5px, -0.4px) scale(1); opacity: 0.9; }
        100% { transform: translate(-1.6px, -1.2px) scale(1.4); opacity: 0; }
      }
      @keyframes puff-r {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        30%  { transform: translate(0.5px, -0.4px) scale(1); opacity: 0.9; }
        100% { transform: translate(1.6px, -1.2px) scale(1.4); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-charge" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- === Wooden crate (right target), resting at (16,12) 3x3 === -->
  <g class="crate-fly">
    <rect x="16" y="12" width="3" height="3" fill="#6D4C41"/>
    <rect x="16.4" y="12.4" width="2.2" height="2.2" fill="#A1887F"/>
    <rect x="16" y="13.3" width="3" height="0.4" fill="#6D4C41"/>
    <rect x="17.3" y="12" width="0.4" height="3" fill="#6D4C41"/>
  </g>

  <!-- === Trash can (left target), resting at (-4,12) 3x3 + lid === -->
  <g class="can-fly" opacity="0">
    <rect x="-4" y="12" width="3" height="3" fill="#90A4AE"/>
    <rect x="-3.4" y="12.4" width="0.4" height="2.2" fill="#607D8B"/>
    <rect x="-2" y="12.4" width="0.4" height="2.2" fill="#607D8B"/>
    <rect x="-4.3" y="11.3" width="3.6" height="0.7" fill="#607D8B"/>
    <rect x="-3" y="10.8" width="1" height="0.5" fill="#455A64"/>
  </g>

  <!-- === Clawd: whole body charge === -->
  <g class="charge-move">
    <g class="run-bounce">
      <g class="impact-squash">

        <!-- Speed lines behind the body (left side, shown during the dash right) -->
        <g class="lines-l" fill="#9E9E9E" opacity="0">
          <rect x="-4" y="7.6" width="2" height="0.5"/>
          <rect x="-4.5" y="9.6" width="2.5" height="0.5"/>
          <rect x="-4" y="11.6" width="2" height="0.5"/>
        </g>
        <!-- Speed lines (right side, shown during the dash left) -->
        <g class="lines-r" fill="#9E9E9E" opacity="0">
          <rect x="17" y="7.6" width="2" height="0.5"/>
          <rect x="17" y="9.6" width="2.5" height="0.5"/>
          <rect x="17" y="11.6" width="2" height="0.5"/>
        </g>

        <!-- Dust puffs behind the feet while revving -->
        <g class="dust-gate-l" fill="#BDBDBD">
          <rect class="puff-l" x="-1.2" y="13.6" width="0.9" height="0.9"/>
          <rect class="puff-l puff-b" x="-0.6" y="14.3" width="0.7" height="0.7"/>
        </g>
        <g class="dust-gate-r" fill="#BDBDBD" opacity="0">
          <rect class="puff-r" x="15.3" y="13.6" width="0.9" height="0.9"/>
          <rect class="puff-r puff-b" x="14.9" y="14.3" width="0.7" height="0.7"/>
        </g>

        <!-- Legs (1x4 from y=11, 2px overlap into the torso so the lean never disconnects) -->
        <g fill="#DE886D">
          <rect class="leg-outer" x="3" y="11" width="1" height="4"/>
          <rect class="leg-inner" x="5" y="11" width="1" height="4"/>
          <rect class="leg-inner" x="9" y="11" width="1" height="4"/>
          <rect class="leg-outer" x="11" y="11" width="1" height="4"/>
        </g>

        <!-- Upper body: torso + eyes + arms + anger mark -->
        <g class="upper-lean">
          <!-- Torso -->
          <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

          <!-- Eyes: angry squint looking toward the charge -->
          <g class="eyes-charge" fill="#000000">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>

          <!-- Left arm (forward when facing left) + shadow -->
          <g class="arm-l-turn">
            <g class="arm-l">
              <rect x="0.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.25"/>
              <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            </g>
          </g>
          <!-- Right arm (forward when facing right) + shadow -->
          <g class="arm-r-turn">
            <g class="arm-r">
              <rect x="13.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.25"/>
              <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
            </g>
          </g>

          <!-- Anger mark: 4 L-shapes, vertices at center, rotated 45 deg -->
          <g transform="translate(12.2, 3.4)">
            <g class="anger-mark">
              <g transform="rotate(45, 1, 0.5)" fill="none" stroke="#FF3D00" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="-0.05,0.15 0.65,0.15 0.65,-0.55"/>
                <polyline points="2.05,0.15 1.35,0.15 1.35,-0.55"/>
                <polyline points="2.05,0.85 1.35,0.85 1.35,1.55"/>
                <polyline points="-0.05,0.85 0.65,0.85 0.65,1.55"/>
              </g>
            </g>
          </g>
        </g>

      </g>
    </g>
  </g>

  <!-- === Impact sparks (world space, at the two contact points) === -->
  <g>
    <rect class="spark-r1" x="16" y="10.5" width="0.8" height="0.8" fill="#FFC107" opacity="0"/>
    <rect class="spark-r2" x="16.6" y="11.6" width="0.7" height="0.7" fill="#FF9800" opacity="0"/>
    <rect class="spark-r3" x="16.2" y="12.4" width="0.6" height="0.6" fill="#FFEB3B" opacity="0"/>
    <rect class="spark-l1" x="-1.8" y="10.5" width="0.8" height="0.8" fill="#FFC107" opacity="0"/>
    <rect class="spark-l2" x="-2.3" y="11.6" width="0.7" height="0.7" fill="#FF9800" opacity="0"/>
    <rect class="spark-l3" x="-1.8" y="12.4" width="0.6" height="0.6" fill="#FFEB3B" opacity="0"/>
  </g>
</svg>
