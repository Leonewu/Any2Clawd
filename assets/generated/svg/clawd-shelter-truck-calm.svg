<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Shelter the little truck, calm version (呵护泥头车·安静版): 4.8s cycle, rain falling the whole
        time. Clawd holds a pink umbrella, tilted toward the truck, out over a cute yellow toy dump
        truck standing beside him, keeping it completely dry - the umbrella covers the
        truck, not him, so raindrops bounce off the canopy and off his own head
        while he smiles ^^ without moving. The truck (warm yellow, beacon lit,
        small quiet bar eyes, faint cheeks) just looks up at him, blinking slowly,
        and a small heart floats up now and then. Clawd leans a little toward the truck and breathes slowly.
      */
      .breathe { transform-origin: 7.5px 15px; animation: breathe 2.4s infinite ease-in-out; }
      .lean { transform-origin: 7.5px 15px; animation: lean 4.8s infinite ease-in-out; }
      .arm-r { animation: arm-r 2.4s infinite ease-in-out; }
      .umbrella { transform-origin: 15.5px 8.5px; animation: umbrella 2.4s infinite ease-in-out; }
      .truck-bob { transform-origin: 17px 14px; animation: truck-bob 1.2s infinite ease-in-out; }
      .truck-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: truck-eyes 4.8s infinite ease-in-out; }
      .beacon-glow { transform-box: fill-box; transform-origin: 50% 50%; animation: beacon-glow 1.2s infinite ease-in-out; }
      .heart { transform-box: fill-box; transform-origin: 50% 50%; animation: heart 4.8s 1.2s infinite ease-out; }
      .shadow-c { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 2.4s infinite ease-in-out; }

      @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 0.985); } }
      @keyframes lean { 0%, 100% { transform: rotate(2deg); } 50% { transform: rotate(3.5deg); } }
      /* right arm raised, holding the umbrella handle; a tiny sway with the breath */
      @keyframes arm-r { 0%, 100% { transform: translate(1.4px, -1.6px); } 50% { transform: translate(1.4px, -1.9px); } }
      @keyframes umbrella { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-1.5deg) translateY(-0.3px); } }
      @keyframes truck-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.25px); } }
      /* truck eyes: ^^ looking up at Clawd (shift left/up), a blink at 60% */
      @keyframes truck-eyes { 0%, 28% { transform: translate(-0.25px, -0.2px) scaleY(1); } 30% { transform: translate(-0.25px, -0.2px) scaleY(0.1); } 32%, 76% { transform: translate(-0.25px, -0.2px) scaleY(1); } 78% { transform: translate(-0.25px, -0.2px) scaleY(0.1); } 80%, 100% { transform: translate(-0.25px, -0.2px) scaleY(1); } }
      @keyframes beacon-glow { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.2); opacity: 0.7; } }
      @keyframes heart { 0%, 3% { transform: translate(0, 0) scale(0.6); opacity: 0; } 10% { transform: translate(0, -0.8px) scale(1); opacity: 0.95; } 32% { transform: translate(-0.6px, -3.6px) scale(1); opacity: 0.9; } 40% { transform: translate(-0.8px, -4.6px) scale(1.1); opacity: 0; } 100% { transform: translate(-0.8px, -4.6px) scale(1.1); opacity: 0; } }
      @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 0.5; } 50% { transform: scaleX(1.015); opacity: 0.5; } }

      /* rain */
      .rx1 { animation: rx1 0.6s 0.02s infinite linear; }
      @keyframes rx1 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(27.6px); opacity: 0.95; } 92%, 100% { transform: translateY(27.6px); opacity: 0; } }
      .rx1-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rx1-s 0.6s 0.02s infinite ease-out; }
      @keyframes rx1-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rx2 { animation: rx2 0.6s 0.47s infinite linear; }
      @keyframes rx2 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(27.6px); opacity: 0.95; } 92%, 100% { transform: translateY(27.6px); opacity: 0; } }
      .rx2-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rx2-s 0.6s 0.47s infinite ease-out; }
      @keyframes rx2-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rx3 { animation: rx3 0.6s 0.22s infinite linear; }
      @keyframes rx3 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(27.6px); opacity: 0.95; } 92%, 100% { transform: translateY(27.6px); opacity: 0; } }
      .rx3-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rx3-s 0.6s 0.22s infinite ease-out; }
      @keyframes rx3-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .ru0 { animation: ru0 0.6s 0.0s infinite linear; }
      @keyframes ru0 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(11.7px); opacity: 0.95; } 92%, 100% { transform: translateY(11.7px); opacity: 0; } }
      .ru0-s { transform-box: fill-box; transform-origin: 50% 50%; animation: ru0-s 0.6s 0.0s infinite ease-out; }
      @keyframes ru0-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .ru1 { animation: ru1 0.6s 0.13s infinite linear; }
      @keyframes ru1 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(11.1px); opacity: 0.95; } 92%, 100% { transform: translateY(11.1px); opacity: 0; } }
      .ru1-s { transform-box: fill-box; transform-origin: 50% 50%; animation: ru1-s 0.6s 0.13s infinite ease-out; }
      @keyframes ru1-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .ru2 { animation: ru2 0.6s 0.26s infinite linear; }
      @keyframes ru2 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(10.8px); opacity: 0.95; } 92%, 100% { transform: translateY(10.8px); opacity: 0; } }
      .ru2-s { transform-box: fill-box; transform-origin: 50% 50%; animation: ru2-s 0.6s 0.26s infinite ease-out; }
      @keyframes ru2-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .ru3 { animation: ru3 0.6s 0.39s infinite linear; }
      @keyframes ru3 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(11.2px); opacity: 0.95; } 92%, 100% { transform: translateY(11.2px); opacity: 0; } }
      .ru3-s { transform-box: fill-box; transform-origin: 50% 50%; animation: ru3-s 0.6s 0.39s infinite ease-out; }
      @keyframes ru3-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .ru4 { animation: ru4 0.6s 0.52s infinite linear; }
      @keyframes ru4 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(12.2px); opacity: 0.95; } 92%, 100% { transform: translateY(12.2px); opacity: 0; } }
      .ru4-s { transform-box: fill-box; transform-origin: 50% 50%; animation: ru4-s 0.6s 0.52s infinite ease-out; }
      @keyframes ru4-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rc0 { animation: rc0 0.6s 0.05s infinite linear; }
      @keyframes rc0 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(18.6px); opacity: 0.95; } 92%, 100% { transform: translateY(18.6px); opacity: 0; } }
      .rc0-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rc0-s 0.6s 0.05s infinite ease-out; }
      @keyframes rc0-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rc1 { animation: rc1 0.6s 0.25s infinite linear; }
      @keyframes rc1 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(18.6px); opacity: 0.95; } 92%, 100% { transform: translateY(18.6px); opacity: 0; } }
      .rc1-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rc1-s 0.6s 0.25s infinite ease-out; }
      @keyframes rc1-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rc2 { animation: rc2 0.6s 0.45s infinite linear; }
      @keyframes rc2 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(18.6px); opacity: 0.95; } 92%, 100% { transform: translateY(18.6px); opacity: 0; } }
      .rc2-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rc2-s 0.6s 0.45s infinite ease-out; }
      @keyframes rc2-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rg1 { animation: rg1 0.6s 0.19s infinite linear; }
      @keyframes rg1 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(27.6px); opacity: 0.95; } 92%, 100% { transform: translateY(27.6px); opacity: 0; } }
      .rg1-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rg1-s 0.6s 0.19s infinite ease-out; }
      @keyframes rg1-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rg2 { animation: rg2 0.6s 0.3s infinite linear; }
      @keyframes rg2 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(27.6px); opacity: 0.95; } 92%, 100% { transform: translateY(27.6px); opacity: 0; } }
      .rg2-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rg2-s 0.6s 0.3s infinite ease-out; }
      @keyframes rg2-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rd0 { animation: rd0 0.6s 0.15s infinite linear; }
      @keyframes rd0 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(15px); opacity: 0.95; } 92%, 100% { transform: translateY(15px); opacity: 0; } }
      .rd0-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rd0-s 0.6s 0.15s infinite ease-out; }
      @keyframes rd0-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
      .rd1 { animation: rd1 0.6s 0.45s infinite linear; }
      @keyframes rd1 { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.95; } 88% { transform: translateY(13.1px); opacity: 0.95; } 92%, 100% { transform: translateY(13.1px); opacity: 0; } }
      .rd1-s { transform-box: fill-box; transform-origin: 50% 50%; animation: rd1-s 0.6s 0.45s infinite ease-out; }
      @keyframes rd1-s { 0%, 86% { transform: scale(0.3); opacity: 0; } 90% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.4) translateY(-0.4px); opacity: 0; } }
    </style>
  </defs>

  <!-- Ground shadows -->
  <rect class="shadow-c" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
  <rect x="13.2" y="15" width="7.8" height="0.8" fill="#000000" opacity="0.28"/>

  <!-- === Clawd: leaning toward the truck, breathing, holding the umbrella out with his right arm === -->
  <g class="lean">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
    </g>
    <g class="breathe">
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <rect x="2.6" y="10" width="1.5" height="0.6" fill="#F8BBD0" opacity="0.9"/>
      <rect x="10.9" y="10" width="1.5" height="0.6" fill="#F8BBD0" opacity="0.9"/>
      <g fill="none" stroke="#000000" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.5,9.5 4.5,8 5.5,9.5"/><polyline points="9.5,9.5 10.5,8 11.5,9.5"/>
      </g>
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      <!-- right arm raised to hold the handle -->
      <g class="arm-r"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
    </g>
  </g>

  <!-- === Little yellow dump truck standing on the ground to the right, looking up === -->
  <g class="truck-bob">
    <rect x="13.4" y="13.3" width="7.4" height="0.6" rx="0.2" fill="#546E7A"/>
    <g fill="#37474F">
      <circle cx="14.6" cy="14.05" r="0.7"/><circle cx="18.4" cy="14.05" r="0.7"/><circle cx="20.0" cy="14.05" r="0.7"/>
    </g>
    <g fill="#B0BEC5">
      <circle cx="14.6" cy="14.05" r="0.27"/><circle cx="18.4" cy="14.05" r="0.27"/><circle cx="20.0" cy="14.05" r="0.27"/>
    </g>
    <!-- dirt heap + bed -->
    <rect x="16.9" y="10.4" width="3.7" height="1.2" rx="0.6" fill="#8D6E63"/>
    <rect x="17.5" y="9.85" width="2.3" height="0.9" rx="0.45" fill="#A1887F"/>
    <rect x="16.5" y="11.2" width="4.4" height="2.3" rx="0.4" fill="#FFC107"/>
    <rect x="16.4" y="11" width="4.6" height="0.4" rx="0.2" fill="#FFE082"/>
    <!-- cab with the face -->
    <rect x="13.2" y="10.5" width="3.2" height="3" rx="0.5" fill="#FFC107"/>
    <rect x="13.6" y="10.9" width="2.4" height="1.5" rx="0.3" fill="#FFF8E1"/>
    <g class="truck-eyes" fill="#37474F">
      <rect x="14.1" y="11.45" width="0.35" height="0.6"/><rect x="15.25" y="11.45" width="0.35" height="0.6"/>
    </g>
    <rect x="13.7" y="12.1" width="0.5" height="0.25" fill="#F8BBD0" opacity="0.7"/>
    <rect x="15.5" y="12.1" width="0.5" height="0.25" fill="#F8BBD0" opacity="0.7"/>
    <!-- beacon, lit -->
    <rect x="15.4" y="10.05" width="0.9" height="0.45" fill="#546E7A"/>
    <rect class="beacon-glow" x="15.2" y="9.25" width="1.3" height="1" rx="0.4" fill="#FFE082" opacity="0.55"/>
    <rect x="15.55" y="9.5" width="0.6" height="0.55" rx="0.15" fill="#FF8F00"/>
  </g>

  <!-- === Pink umbrella held over the truck (handle from Clawd's raised hand) === -->
  <g class="umbrella">
    <g transform="rotate(10, 15.5, 8.8)">
      <rect x="15.35" y="1.8" width="0.35" height="7.2" fill="#5D4037"/>
      <rect x="15.2" y="8.6" width="0.9" height="0.4" rx="0.2" fill="#5D4037"/>
      <g fill="#F48FB1">
        <rect x="10" y="0.2" width="11" height="0.9"/>
        <rect x="10.9" y="-0.6" width="9.2" height="0.9"/>
        <rect x="12.1" y="-1.3" width="6.8" height="0.8"/>
        <rect x="13.6" y="-1.9" width="3.8" height="0.7"/>
        <rect x="15" y="-2.4" width="1" height="0.6"/>
      </g>
      <g fill="#FCE4EC">
        <rect x="12.1" y="0.2" width="1.8" height="0.9"/><rect x="17.1" y="0.2" width="1.8" height="0.9"/>
        <rect x="12.9" y="-0.6" width="1.4" height="0.9"/><rect x="16.7" y="-0.6" width="1.4" height="0.9"/>
      </g>
      <rect x="15.3" y="-2.9" width="0.45" height="0.6" fill="#5D4037"/>
    </g>
  </g>

  <!-- === Rain (drawn on top; drops over the umbrella stop at the canopy, drops over Clawd stop at his head) === -->
  <g fill="#90CAF9">
    <rect class="rx1" x="-1.8" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rx1-s" opacity="0"><rect x="-2.39" y="14.8" width="0.35" height="0.35"/><rect x="-1.2400000000000002" y="14.8" width="0.35" height="0.35"/></g>
    <rect class="rx2" x="0.1" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rx2-s" opacity="0"><rect x="-0.49" y="14.8" width="0.35" height="0.35"/><rect x="0.66" y="14.8" width="0.35" height="0.35"/></g>
    <rect class="rx3" x="11.0" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rx3-s" opacity="0"><rect x="10.41" y="14.8" width="0.35" height="0.35"/><rect x="11.56" y="14.8" width="0.35" height="0.35"/></g>
    <rect class="ru0" x="12.8" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="ru0-s" opacity="0"><rect x="12.21" y="-1.5" width="0.35" height="0.35"/><rect x="13.36" y="-1.5" width="0.35" height="0.35"/></g>
    <rect class="ru1" x="14.6" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="ru1-s" opacity="0"><rect x="14.01" y="-2.1" width="0.35" height="0.35"/><rect x="15.16" y="-2.1" width="0.35" height="0.35"/></g>
    <rect class="ru2" x="16.5" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="ru2-s" opacity="0"><rect x="15.91" y="-2.4" width="0.35" height="0.35"/><rect x="17.06" y="-2.4" width="0.35" height="0.35"/></g>
    <rect class="ru3" x="18.4" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="ru3-s" opacity="0"><rect x="17.81" y="-2" width="0.35" height="0.35"/><rect x="18.96" y="-2" width="0.35" height="0.35"/></g>
    <rect class="ru4" x="20.2" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="ru4-s" opacity="0"><rect x="19.61" y="-1" width="0.35" height="0.35"/><rect x="20.76" y="-1" width="0.35" height="0.35"/></g>
    <rect class="rc0" x="3.2" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rc0-s" opacity="0"><rect x="2.6100000000000003" y="5.6" width="0.35" height="0.35"/><rect x="3.7600000000000002" y="5.6" width="0.35" height="0.35"/></g>
    <rect class="rc1" x="6.1" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rc1-s" opacity="0"><rect x="5.51" y="5.6" width="0.35" height="0.35"/><rect x="6.66" y="5.6" width="0.35" height="0.35"/></g>
    <rect class="rc2" x="9.0" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rc2-s" opacity="0"><rect x="8.41" y="5.6" width="0.35" height="0.35"/><rect x="9.56" y="5.6" width="0.35" height="0.35"/></g>
    <rect class="rg1" x="-0.9" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rg1-s" opacity="0"><rect x="-1.49" y="14.8" width="0.35" height="0.35"/><rect x="-0.33999999999999997" y="14.8" width="0.35" height="0.35"/></g>
    <rect class="rg2" x="1.0" y="-13" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rg2-s" opacity="0"><rect x="0.4099999999999999" y="14.8" width="0.35" height="0.35"/><rect x="1.56" y="14.8" width="0.35" height="0.35"/></g>
    <rect class="rd0" x="11.7" y="-0.4" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rd0-s" opacity="0"><rect x="11.11" y="14.8" width="0.35" height="0.35"/><rect x="12.26" y="14.8" width="0.35" height="0.35"/></g>
    <rect class="rd1" x="22.5" y="1.5" width="0.32" height="1.3" rx="0.16" opacity="0"/>
    <g class="rd1-s" opacity="0"><rect x="21.91" y="14.8" width="0.35" height="0.35"/><rect x="23.06" y="14.8" width="0.35" height="0.35"/></g>
  </g>

  <!-- a small heart from the truck -->
  <g class="heart" fill="#F48FB1" opacity="0">
    <rect x="12.4" y="7.6" width="0.5" height="0.5"/><rect x="13.2" y="7.6" width="0.5" height="0.5"/>
    <rect x="12.2" y="8.1" width="1.7" height="0.5"/><rect x="12.6" y="8.6" width="0.9" height="0.5"/><rect x="12.9" y="9.1" width="0.3" height="0.3"/>
  </g>
</svg>
