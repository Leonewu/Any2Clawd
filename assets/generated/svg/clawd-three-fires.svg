<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Three fires (angry): 3s cycle. Three pixel flames hover 2 units above
        Clawd's head - a big one in the middle, two smaller ones at the sides -
        each licking and swaying on its own rhythm, with embers drifting up.
        Clawd: angry brows, tight squint, pulsing flush, heavy huffing breath
        (chest heaving 0.6s) and a full-body tremble.
      */
      .tremble { transform-origin: 7.5px 15px; animation: tremble 0.1s infinite linear; }
      .arm-l { animation: arm-tremble-l 0.1s infinite linear; }
      .arm-r { animation: arm-tremble-r 0.1s infinite linear; }
      .shadow-fury { transform-box: fill-box; transform-origin: 50% 50%; animation: tremble 0.1s infinite linear; }
      @keyframes tremble {
        0%   { transform: translate(0.15px, 0); }
        25%  { transform: translate(-0.15px, 0.1px); }
        50%  { transform: translate(0.1px, -0.1px); }
        75%  { transform: translate(-0.1px, 0.05px); }
        100% { transform: translate(0.15px, 0); }
      }
      @keyframes arm-tremble-l { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-0.2px, 0.2px); } }
      @keyframes arm-tremble-r { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0.2px, -0.2px); } }
      .huff { transform-origin: 7.5px 13px; animation: huff 0.6s infinite ease-in-out; }
      .f-left   { transform-origin: 3.5px 4px; animation: flick-b 0.5s infinite ease-in-out; }
      .f-center { transform-origin: 7.5px 4px; animation: flick-a 0.375s infinite ease-in-out; }
      .f-right  { transform-origin: 11.5px 4px; animation: flick-b 0.5s 0.25s infinite ease-in-out; }
      .flush { animation: flush 0.6s infinite ease-in-out; }
      .eyes-fury { transform-box: fill-box; transform-origin: 50% 50%; animation: eyes-fury 3s infinite ease-in-out; }
      @keyframes huff {
        0%, 100% { transform: scale(1, 1) translateY(0); }
        45%      { transform: scale(1.04, 1.05) translateY(-0.4px); }
      }
      @keyframes flick-a { 0%, 100% { transform: scale(1, 1) translateX(0); } 50% { transform: scale(1.06, 1.15) translateX(0.3px); } }
      @keyframes flick-b { 0%, 100% { transform: scale(1, 1.08) translateX(-0.25px); } 50% { transform: scale(0.95, 0.92) translateX(0.25px); } }
      @keyframes flush { 0%, 100% { opacity: 0.2; } 45% { opacity: 0.42; } }
      @keyframes eyes-fury {
        0%, 55%   { transform: scaleY(0.6); }
        57%       { transform: scaleY(0.05); }
        59%, 100% { transform: scaleY(0.6); }
      }
      .ember-1 { transform-box: fill-box; transform-origin: 50% 50%; animation: ember-1 0.75s 0s infinite ease-out; }
      @keyframes ember-1 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 0.95; } 100% { transform: translate(-0.4px, -2px) scale(0.4); opacity: 0; } }
      .ember-2 { transform-box: fill-box; transform-origin: 50% 50%; animation: ember-2 1.0s 0.3s infinite ease-out; }
      @keyframes ember-2 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 0.95; } 100% { transform: translate(0.3px, -2px) scale(0.4); opacity: 0; } }
      .ember-3 { transform-box: fill-box; transform-origin: 50% 50%; animation: ember-3 0.75s 0.5s infinite ease-out; }
      @keyframes ember-3 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 0.95; } 100% { transform: translate(0.4px, -2px) scale(0.4); opacity: 0; } }
      .ember-4 { transform-box: fill-box; transform-origin: 50% 50%; animation: ember-4 1.0s 0.6s infinite ease-out; }
      @keyframes ember-4 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 0.95; } 100% { transform: translate(-0.3px, -1.8px) scale(0.4); opacity: 0; } }
      .ember-5 { transform-box: fill-box; transform-origin: 50% 50%; animation: ember-5 0.75s 0.2s infinite ease-out; }
      @keyframes ember-5 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 0.95; } 100% { transform: translate(0.3px, -1.8px) scale(0.4); opacity: 0; } }
    </style>
  </defs>

  <rect class="shadow-fury" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Clawd -->
  <g class="tremble">
      <g fill="#DE886D">
        <rect x="3" y="13" width="1" height="2"/>
        <rect x="5" y="13" width="1" height="2"/>
        <rect x="9" y="13" width="1" height="2"/>
        <rect x="11" y="13" width="1" height="2"/>
      </g>
    <g class="huff">
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <rect class="flush" x="2" y="6" width="11" height="7" fill="#D32F2F" opacity="0.3"/>
      <g fill="#000000">
        <rect x="3.5" y="6.9" width="1.9" height="0.55" transform="rotate(22, 4.45, 7.17)"/>
        <rect x="9.6" y="6.9" width="1.9" height="0.55" transform="rotate(-22, 10.55, 7.17)"/>
      </g>
      <g class="eyes-fury" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
      <g class="arm-l"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g>
      <g class="arm-r"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>

      <!-- Three fires hovering above the head (base at y=4, head top at y=6) -->
      <g transform="translate(3.5, 4) scale(0.5) translate(-3.5, -4)">
      <g class="f-left">
        <rect x="2" y="1.5" width="3" height="2.5" fill="#FF3D00"/>
        <rect x="2.5" y="-0.5" width="2" height="2" fill="#FF3D00"/>
        <rect x="3" y="-1.5" width="1" height="1" fill="#FF3D00"/>
        <rect x="2.5" y="2.2" width="2" height="1.8" fill="#FF9100"/>
        <rect x="3" y="0.8" width="1" height="1.4" fill="#FF9100"/>
        <rect x="3" y="2.8" width="1" height="1.2" fill="#FFD54F"/>
      </g>
      </g>
      <g transform="translate(7.5, 4) scale(0.5) translate(-7.5, -4)">
      <g class="f-center">
        <rect x="5.5" y="1.5" width="4" height="2.5" fill="#FF3D00"/>
        <rect x="6" y="-0.5" width="3" height="2" fill="#FF3D00"/>
        <rect x="6.5" y="-2" width="2" height="1.5" fill="#FF3D00"/>
        <rect x="7" y="-2.8" width="1" height="0.8" fill="#FF3D00"/>
        <rect x="6" y="2.2" width="3" height="1.8" fill="#FF9100"/>
        <rect x="6.5" y="0.5" width="2" height="1.7" fill="#FF9100"/>
        <rect x="7" y="-0.8" width="1" height="1.3" fill="#FF9100"/>
        <rect x="6.5" y="2.6" width="2" height="1.4" fill="#FFD54F"/>
        <rect x="7" y="1.4" width="1" height="1.2" fill="#FFD54F"/>
      </g>
      </g>
      <g transform="translate(11.5, 4) scale(0.5) translate(-11.5, -4)">
      <g class="f-right">
        <rect x="10" y="1.5" width="3" height="2.5" fill="#FF3D00"/>
        <rect x="10.5" y="-0.5" width="2" height="2" fill="#FF3D00"/>
        <rect x="11" y="-1.5" width="1" height="1" fill="#FF3D00"/>
        <rect x="10.5" y="2.2" width="2" height="1.8" fill="#FF9100"/>
        <rect x="11" y="0.8" width="1" height="1.4" fill="#FF9100"/>
        <rect x="11" y="2.8" width="1" height="1.2" fill="#FFD54F"/>
      </g>
      </g>
    </g>
  </g>

  <!-- Embers -->
  <g>
    <rect class="ember-1" x="3.3" y="1.3" width="0.4" height="0.4" fill="#FFD54F" opacity="0"/>
    <rect class="ember-2" x="7.3" y="0.6" width="0.5" height="0.5" fill="#FFEB3B" opacity="0"/>
    <rect class="ember-3" x="11.3" y="1.3" width="0.4" height="0.4" fill="#FF9100" opacity="0"/>
    <rect class="ember-4" x="5.8" y="1.8" width="0.4" height="0.4" fill="#FF9100" opacity="0"/>
    <rect class="ember-5" x="9.5" y="1.8" width="0.4" height="0.4" fill="#FFD54F" opacity="0"/>
  </g>
</svg>
